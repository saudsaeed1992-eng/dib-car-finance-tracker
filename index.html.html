
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIB Finance Tracker Secure</title>
<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f7fb;
}
.login{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.box{
background:white;
padding:30px;
border-radius:18px;
width:320px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}
h2{
margin-top:0;
text-align:center;
}
input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
border:1px solid #ccc;
box-sizing:border-box;
}
button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:12px;
background:#0b6b57;
color:white;
font-weight:bold;
cursor:pointer;
}
#error{
color:red;
font-size:14px;
margin-top:10px;
text-align:center;
}
iframe{
border:none;
width:100%;
height:100vh;
display:none;
}
</style>
</head>
<body>

<div class="login" id="loginScreen">
<div class="box">
<h2>DIB Finance Tracker</h2>
<p style="text-align:center">Protected Access</p>

<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">Open Tracker</button>

<div id="error"></div>
</div>
</div>

<iframe id="trackerFrame"></iframe>

<script>
const APP_PASSWORD = "Saud @5010ss";

function login(){
const pass = document.getElementById("password").value;

if(pass === APP_PASSWORD){
localStorage.setItem("tracker_logged_in","yes");

document.getElementById("loginScreen").style.display="none";

const trackerHTML = `
<!doctype html>
<html>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>DIB Tracker</title>
<style>
body{font-family:Arial;background:#f6f7fb;margin:0;padding:20px;}
.card{background:white;padding:20px;border-radius:18px;}
</style>
</head>
<body>
<div class='card'>
<h2>DIB Car Finance Tracker</h2>
<p>Secure tracker loaded successfully.</p>
<p>Your protected version is working.</p>
</div>
</body>
</html>
`;

const blob = new Blob([trackerHTML], {type:"text/html"});
const url = URL.createObjectURL(blob);

const frame = document.getElementById("trackerFrame");
frame.src = url;
frame.style.display = "block";

}else{
document.getElementById("error").innerText = "Wrong password";
}
}
</script>

</body>
</html>
